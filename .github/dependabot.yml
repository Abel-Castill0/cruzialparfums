version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # typescript-eslint (8.71.1) declares peer typescript >=4.8.4 <6.1.0, so TypeScript 7 cannot be installed
      # without bypassing the peer contract. Remove this entry once typescript-eslint publishes TS 7 support.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # @types/node must match the runtime Node major: Vercel (project setting 24.x) and CI run Node 24, so types for
      # newer majors would accept APIs that do not exist in production. Remove this entry when the runtime moves up.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      # init and analyze (and any other sub-action) must move together: the Analyze job fails when the
      # github/codeql-action steps use different versions, so one-at-a-time bumps can never pass CI.
      codeql-action:
        patterns:
          - "github/codeql-action*"
