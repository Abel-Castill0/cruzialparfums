name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint · typecheck · build · unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run catalog:check
      - run: npm run commercial:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # No Supabase environment on purpose: the app must build without one
      # (every storefront page is request-dynamic; nothing is fetched at
      # build time), so a missing secret can never leak into the bundle.
      - run: npm run build

  database:
    name: Database (migrations · pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      # Fresh local stack: applies the whole migration chain from zero, then
      # the exact committed C2 fixture the reconciliation pgTAP needs.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: node scripts/prepare-commercial-reconciliation-test.mjs
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
