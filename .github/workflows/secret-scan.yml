name: Secret scan

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege: gitleaks-action only needs to read the checked-out
    # repo to scan it. GITHUB_TOKEN is used solely to call the GitHub API
    # for PR comments, which this workflow explicitly disables below
    # (GITLEAKS_ENABLE_COMMENTS: false) so no write scope is requested.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # v3 migrates the action's own runtime to Node 24 (GitHub removes
      # Node 20 from hosted runners on 2026-09-16); v2 stops working
      # regardless of any opt-out flag. No input/output/behavior changes.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          # GITLEAKS_LICENSE is only required for organization-owned repos;
          # this is a personal-account repo, so none is configured.
