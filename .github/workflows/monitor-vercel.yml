name: Monitor Vercel Production

# Hourly, READ-ONLY check of the latest Production deployments (see scripts/monitor-vercel.mjs and docs/monitoring.md).
# Needs the repository secret VERCEL_TOKEN. Alerts go to GitHub Issues with the job's own short-lived GITHUB_TOKEN
# (issues: write on this job only); Discord is opt-in with the repository variable MONITOR_CHANNEL=discord plus the
# DISCORD_WEBHOOK_URL secret. Until VERCEL_TOKEN exists the job only emits a visible warning and does nothing.
# Scheduled workflows run from the default branch only and never receive secrets from fork pull requests.

# Hourly at minute 17 UTC (GitHub may delay scheduled runs under load). GitHub registers a schedule when this file
# changes on the default branch; after disabling/re-enabling the workflow, verify that "schedule" runs appear again.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read Vercel but write nothing (no issue, comment or webhook)"
        type: boolean
        default: true
      alert_selftest:
        description: "Prove alert delivery: create, comment and close a clearly labelled self-test issue"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monitor-vercel
  cancel-in-progress: false

jobs:
  monitor:
    name: Vercel deployment errors
    if: github.repository == 'Abel-Castill0/cruzialparfums'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      MONITOR_CHANNEL: ${{ vars.MONITOR_CHANNEL || 'github' }}
      # Only handed to the scripts when Discord was chosen; the default GitHub path does not need it.
      DISCORD_WEBHOOK_URL: ${{ vars.MONITOR_CHANNEL == 'discord' && secrets.DISCORD_WEBHOOK_URL || '' }}
      # A scheduled run has no inputs, so it is a real run; a manual run is a dry run unless unticked.
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Lockfile-verified install without lifecycle scripts, so no package script runs while the secrets are around.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/web
      - name: Alert delivery self-test
        if: inputs.alert_selftest == true
        env:
          MONITOR_SELFTEST_SOURCE: monitor-vercel
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/monitor-alert-selftest.mjs
      - name: Check configuration
        id: config
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning title=Vercel monitor NOT running::The VERCEL_TOKEN repository secret is not set, so no Production check was made."
            echo "### Vercel monitor is not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Set the \`VERCEL_TOKEN\` repository secret (see docs/monitoring.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Monitor
        if: steps.config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Short-lived job token, given only to the steps that may write issues.
          GITHUB_TOKEN: ${{ github.token }}
          # IDs, not secrets: they already appear in every Vercel comment on the public pull requests.
          VERCEL_PROJECT_ID: prj_u2ZX24IO9akHdN0qlzveQNwte59l
          VERCEL_TEAM_ID: team_OPJLunXDFXq0o9kKQK6VOt8Z
          MONITOR_DEPLOYMENTS: "5"
          MONITOR_THRESHOLD: "10"
          MONITOR_TARGET: production
        run: node scripts/monitor-vercel.mjs
